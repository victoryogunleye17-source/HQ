<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --accent: #00d4ff;
      --accent-dim: #0099bb;
      --text: #f0f0f5;
      --muted: #8888a0;
      --success: #00e676;
      --danger: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(ellipse at top, #1a1a2e 0%, transparent 60%),
        radial-gradient(ellipse at bottom right, #0d1b2a 0%, transparent 50%);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      background: linear-gradient(135deg, #00d4ff, #7b61ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
      text-align: center;
      max-width: 420px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .camera-card {
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
    }

    #video, #canvas, #snapshot {
      width: 100%;
      display: block;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: #000;
    }

    #canvas, #snapshot {
      display: none;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.85rem 1.6rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #startBtn {
      background: linear-gradient(135deg, #00d4ff, #0099bb);
      color: #000;
    }

    #startBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,212,255,0.35);
    }

    #snapBtn {
      background: linear-gradient(135deg, #ff5252, #c62828);
      color: #fff;
    }

    #snapBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,82,82,0.35);
    }

    #retryBtn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    #retryBtn:hover:not(:disabled) {
      background: rgba(255,255,255,0.14);
    }

    .status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.4em;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .result-card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.35rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.06);
      display: none;
    }

    .result-card.visible {
      display: block;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card h2 {
      font-size: 1.05rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    #description {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--text);
    }

    #description ul {
      margin-top: 0.6rem;
      padding-left: 1.25rem;
    }

    #description li {
      margin-bottom: 0.35rem;
    }

    .confidence {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .loader {
      display: none;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0,212,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .loader.visible {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    /* Permission overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15,15,19,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      z-index: 5;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <h1>HQ</h1>
  <p class="subtitle">Point your camera, take a photo, and let AI tell you everything it sees.</p>

  <div class="app">
    <div class="camera-card">
      <div id="permissionOverlay" class="overlay">
        <p>Camera access is required. Click the button below to start.</p>
        <button id="startBtn">Enable Camera</button>
      </div>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <img id="snapshot" alt="Captured photo">
    </div>

    <div class="controls">
      <button id="snapBtn" disabled>📸 Snap Photo</button>
      <button id="retryBtn" style="display:none">🔄 Try Again</button>
    </div>

    <div class="status" id="status"></div>
    <div class="loader" id="loader"></div>

    <div class="result-card" id="resultCard">
      <h2>What I saw</h2>
      <div id="description"></div>
    </div>
  </div>

  <footer>HQ · Runs entirely in your browser · Powered by TensorFlow.js + COCO-SSD</footer>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapshot = document.getElementById('snapshot');
    const startBtn = document.getElementById('startBtn');
    const snapBtn = document.getElementById('snapBtn');
    const retryBtn = document.getElementById('retryBtn');
    const statusEl = document.getElementById('status');
    const loader = document.getElementById('loader');
    const resultCard = document.getElementById('resultCard');
    const description = document.getElementById('description');
    const overlay = document.getElementById('permissionOverlay');

    let stream = null;
    let model = null;
    let isAnalyzing = false;

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    async function loadModel() {
      setStatus('Loading vision model…');
      try {
        model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
        setStatus('Model ready. Point camera and snap!');
      } catch (err) {
        console.error(err);
        setStatus('Failed to load model. Check your connection.', 'error');
      }
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        overlay.classList.add('hidden');
        snapBtn.disabled = false;
        setStatus('Camera ready. Snap when you see something interesting.');
        // Preload model while camera is warming up
        if (!model) loadModel();
      } catch (err) {
        console.error(err);
        let msg = 'Could not access camera. ';
        if (err.name === 'NotAllowedError') {
          msg += 'Please allow camera permission and reload.';
        } else if (err.name === 'NotFoundError') {
          msg += 'No camera found on this device.';
        } else {
          msg += err.message;
        }
        setStatus(msg, 'error');
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    async function snapPhoto() {
      if (!stream || isAnalyzing) return;

      // Draw current video frame to canvas
      const w = video.videoWidth;
      const h = video.videoHeight;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      // Show the snapshot
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      snapshot.src = dataUrl;
      snapshot.style.display = 'block';
      video.style.display = 'none';

      // Hide live controls, show retry
      snapBtn.style.display = 'none';
      retryBtn.style.display = 'inline-flex';
      stopCamera();

      // Analyze
      await analyzeImage(canvas);
    }

    async function analyzeImage(imgElement) {
      if (!model) {
        setStatus('Model still loading… please wait a moment and try again.', 'error');
        return;
      }

      isAnalyzing = true;
      loader.classList.add('visible');
      setStatus('Looking at the photo…');
      resultCard.classList.remove('visible');

      try {
        const predictions = await model.detect(imgElement);

        // Sort by confidence
        predictions.sort((a, b) => b.score - a.score);

        if (predictions.length === 0) {
          description.innerHTML = `<p>I couldn't clearly identify any common objects in this photo. Try a clearer shot with better lighting or more distinct subjects.</p>`;
        } else {
          // Build a natural description
          const unique = {};
          predictions.forEach(p => {
            const name = p.class;
            if (!unique[name] || p.score > unique[name]) {
              unique[name] = p.score;
            }
          });

          const items = Object.entries(unique)
            .map(([name, score]) => ({ name, score }))
            .sort((a, b) => b.score - a.score);

          let html = `<p>Here's what I detected:</p><ul>`;
          items.forEach(({ name, score }) => {
            const pct = Math.round(score * 100);
            html += `<li><strong>${capitalize(name)}</strong> <span class="confidence">(${pct}% confidence)</span></li>`;
          });
          html += `</ul>`;

          // Add a short summary sentence
          if (items.length === 1) {
            html = `<p>I mainly see a <strong>${items[0].name}</strong> in this picture.</p>` + html;
          } else if (items.length <= 3) {
            const names = items.map(i => i.name);
            const last = names.pop();
            html = `<p>I can see ${names.join(', ')} and a ${last}.</p>` + html;
          } else {
            html = `<p>I spotted several things: ${items.slice(0, 3).map(i => i.name).join(', ')}, and more.</p>` + html;
          }

          description.innerHTML = html;
        }

        resultCard.classList.add('visible');
        setStatus('Analysis complete.', 'success');
      } catch (err) {
        console.error(err);
        setStatus('Something went wrong while analyzing the image.', 'error');
        description.innerHTML = `<p>Error: ${err.message}</p>`;
        resultCard.classList.add('visible');
      } finally {
        loader.classList.remove('visible');
        isAnalyzing = false;
      }
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function retry() {
      // Reset UI
      snapshot.style.display = 'none';
      video.style.display = 'block';
      resultCard.classList.remove('visible');
      description.innerHTML = '';
      snapBtn.style.display = 'inline-flex';
      retryBtn.style.display = 'none';
      setStatus('');
      startCamera();
    }

    // Event listeners
    startBtn.addEventListener('click', startCamera);
    snapBtn.addEventListener('click', snapPhoto);
    retryBtn.addEventListener('click', retry);

    // Optional: auto-start if permission already granted
    // (browsers rarely allow this without gesture, so we keep the button)
  </script>
</body>
</html>
